<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEO-TOKYO: AKIRA PROTOCOL - Cyberpunk Shmup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Press+Start+2P&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-BrYwSF8O.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-czOEpOHz.css">
</head>
<body>
  <div id="app-container">
    <!-- Game Canvas Wrapper -->
    <div id="game-wrapper">
      <div id="game-container"></div>
      
      <!-- CRT Scanline & Neon Overlay -->
      <div class="crt-overlay"></div>
    </div>

    <!-- Modal Cyberpunk de Pagamento PIX Mercado Pago -->
    <div id="pix-modal" class="pix-modal-backdrop hidden">
      <div class="pix-modal-card">
        <button id="pix-modal-close" class="modal-close-btn">&times;</button>
        <div class="modal-header">
          <div class="modal-tag">MERCADO PAGO // PIX SECURE</div>
          <h2 id="pix-modal-title">CARREGANDO PACOTE...</h2>
          <p id="pix-modal-desc">Escaneie o QR Code abaixo no app do seu banco</p>
        </div>

        <div class="qr-container">
          <div class="qr-frame">
            <img id="pix-qr-image" src="" alt="QR Code Pix" />
            <div id="pix-loading-spinner" class="spinner"></div>
          </div>
          <div class="amount-tag">VALOR: <span id="pix-modal-amount">R$ 0,00</span></div>
        </div>

        <div class="pix-copy-section">
          <label for="pix-copy-input">Código Pix Copia e Cola:</label>
          <div class="copy-input-group">
            <input type="text" id="pix-copy-input" readonly value="" />
            <button id="pix-copy-btn" class="cyber-btn sm">COPIAR</button>
          </div>
        </div>

        <div class="pix-status-box">
          <div class="status-indicator pulsing"></div>
          <span id="pix-status-text">Aguardando confirmação bancária...</span>
        </div>

        <!-- Dev Mode Test Button -->
        <div id="pix-dev-section" class="dev-box">
          <button id="pix-dev-approve-btn" class="dev-btn">⚡ [TESTE] Simular Aprovação Imediata</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification Overlay -->
    <div id="toast-container"></div>
  </div>

</body>
</html>
